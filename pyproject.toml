[project]
name = "gentle-ai-model-router"
version = "0.0.1"
description = "Learned phase-aware model+effort router for Gentle AI SDD phases"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "tenacity>=8.4",
    "datasets>=2.20",
    "python-dotenv>=1.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pytest-httpx>=0.30",
    "respx>=0.21",
]
# Heavy ML stack — ONLY needed for `router train` / ranker evaluation.
# The base install and all core logic tests run without it; training modules
# import torch/transformers lazily.
train = [
    "torch>=2.3",
    "transformers>=4.44",
    "accelerate>=0.33",
]

[project.scripts]
router = "gentle_ai_model_router.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gentle_ai_model_router"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
